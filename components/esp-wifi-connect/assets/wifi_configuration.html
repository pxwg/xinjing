<!DOCTYPE html>
<html>
  <head>
    <title>Network Configuration</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="referrer no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f0f0f0; }
      label { display: block; margin-bottom: 5px; }
      input { width: 100%; padding: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 3px; }
      input[type="submit"] { background-color: #007bff; color: #fff; border: none; border-radius: 3px; padding: 10px; cursor: pointer; }
      input[type="submit"]:disabled { background-color: #ccc; cursor: not-allowed; }
      #ap_list { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px; }
      #ap_list a { display: block; margin-top: 5px; color: #007bff; text-decoration: none; }
      .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: #fff; padding: 15px; border-radius: 8px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
      .toast.show { opacity: 1; }
      .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 999; }
      .loading-overlay.show { display: flex; }
      .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .tabs { display: flex; border-bottom: 1px solid #ccc; padding-left: 10px; margin-top: 20px; }
      .tab { padding: 10px 20px; cursor: pointer; border: 1px solid #ccc; border-bottom: none; border-radius: 5px 5px 0 0; background: #e0e0e0; margin-right: 5px; }
      .tab.active { background: #fff; border-bottom: 1px solid #fff; margin-bottom: -1px; }
      .tab-content { display: none; padding: 20px; background: #fff; }
      .tab-content.active { display: block; }
    </style>
  </head>
  <body>
    <div id="toast" class="toast"></div>
    <div id="loading" class="loading-overlay">
      <div class="spinner"></div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="setTab('wifi')">Wi-Fi Config</div>
      <div class="tab" onclick="setTab('advanced')">Advanced</div>
    </div>
    <div id="wifi-tab" class="tab-content active">
      <h3>New Wi-Fi</h3>
      <p id="error" style="color:red"></p>
      <form onsubmit="submitForm(event)">
        <p><label>SSID:</label><input type="text" id="ssid" required readonly></p>
        <p><label>Username (Enterprise Only):</label><input type="text" id="username" placeholder="Optional"></p>
        <p><label>Password:</label><input type="password" id="password"></p>
        <p><input type="submit" value="Connect" id="btn-connect"></p>
      </form>
      <div id="ap_list">Scanning...</div>
    </div>
    <div id="advanced-tab" class="tab-content">
      <form onsubmit="saveAdvanced(event)">
        <h3>Advanced</h3>
        <p><label>OTA URL:</label><input type="text" id="ota_url"></p>
        <p><label>Max TX Power:</label><input type="number" id="max_tx_power" min="8" max="80"></p>
        <p><label><input type="checkbox" id="remember_bssid" style="width:auto"> Remember BSSID</label></p>
        <p><label><input type="checkbox" id="sleep_mode" style="width:auto"> Sleep Mode</label></p>
        <p><input type="submit" value="Save" id="btn-save"></p>
      </form>
    </div>
    <script>
      function setTab(name) {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          event.target.classList.add('active');
          document.getElementById(name+'-tab').classList.add('active');
      }

      function toast(msg) {
          const t = document.getElementById('toast');
          t.textContent = msg;
          t.classList.add('show');
          setTimeout(() => t.classList.remove('show'), 3000);
      }

      async function submitForm(e) {
          e.preventDefault();
          document.getElementById('btn-connect').disabled = true;
          document.getElementById('loading').classList.add('show');
          document.getElementById('error').textContent = '';

          const data = {
              ssid: document.getElementById('ssid').value,
              password: document.getElementById('password').value,
              username: document.getElementById('username').value
          };

          try {
              const res = await fetch('/submit', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify(data)
              });
              const json = await res.json();
              if (!json.success) throw new Error(json.error || 'Connection Failed');
              window.location.href = '/done.html';
          } catch (err) {
              document.getElementById('error').textContent = err.message;
              document.getElementById('btn-connect').disabled = false;
              document.getElementById('loading').classList.remove('show');
          }
      }

      async function saveAdvanced(e) {
          e.preventDefault();
          const data = {
              ota_url: document.getElementById('ota_url').value,
              max_tx_power: parseInt(document.getElementById('max_tx_power').value),
              remember_bssid: document.getElementById('remember_bssid').checked,
              sleep_mode: document.getElementById('sleep_mode').checked
          };
          await fetch('/advanced/submit', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(data)
          });
          toast('Settings Saved');
      }

      function loadScan() {
          fetch('/scan').then(r => r.json()).then(d => {
              const list = document.getElementById('ap_list');
              list.innerHTML = '';
              d.aps.forEach(ap => {
                  const a = document.createElement('a');
                  a.href = '#';
                  let icon = ap.authmode === 0 ? ' 🌐' : ' 🔒';
                  if (ap.authmode === 5) icon = ' 🏢'; // Enterprise
                  a.textContent = ap.ssid + ` (${ap.rssi} dBm)` + icon;
                  a.onclick = () => {
                      document.getElementById('ssid').value = ap.ssid;
                      if (ap.authmode === 5) document.getElementById('username').focus();
                      else document.getElementById('password').focus();
                  };
                  list.appendChild(a);
              });
              setTimeout(loadScan, 5000);
          }).catch(() => setTimeout(loadScan, 5000));
      }

      document.addEventListener('DOMContentLoaded', () => {
          loadScan();
          fetch('/advanced/config').then(r => r.json()).then(d => {
              if(d.ota_url) document.getElementById('ota_url').value = d.ota_url;
              if(d.max_tx_power) document.getElementById('max_tx_power').value = d.max_tx_power;
              if(d.remember_bssid) document.getElementById('remember_bssid').checked = true;
              if(d.sleep_mode) document.getElementById('sleep_mode').checked = true;
          });
      });
    </script>
  </body>
</html>
