<!DOCTYPE html>
<html>
<head>
    <title>Network Configuration</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="referrer no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style type="text/css">
        /* ========== Base Styles ========== */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        /* ========== Form Elements ========== */
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        input[type="submit"] {
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 3px;
            padding: 10px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        input[type="submit"]:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #remember_bssid, #sleep_mode {
            width: auto;
        }

        /* ========== AP List Styles ========== */
        #ap_list {
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
        #ap_list .scanning {
            font-style: italic;
            color: #666;
        }
        #ap_list a {
            display: block;
            margin-top: 5px;
            color: #007bff;
            text-decoration: none;
        }
        #ap_list a:hover {
            text-decoration: underline;
        }

        /* ========== Language Switcher ========== */
        .language-switch {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .language-switch select {
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }

        /* ========== Tab Styles ========== */
        .tabs {
            display: flex;
            margin-top: 20px;
            margin-bottom: 0;
            padding-left: 20px;
            border-bottom: 1px solid #ccc;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
            margin-right: 5px;
            background-color: #f0f0f0;
            position: relative;
            top: 1px;
        }
        .tab.active {
            background-color: #fff;
        }
        .tab-content {
            display: none;
            border-top: none;
            padding: 20px;
            background-color: #fff;
        }
        .tab-content.active {
            display: block;
        }

        /* ========== Toast Message Styles ========== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            min-width: 200px;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
        }

        /* ========== Loading Spinner Styles ========== */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .loading-overlay.show {
            display: flex;
        }
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .loading-text {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text" data-lang="connecting">Connecting...</div>
        </div>
    </div>
    
    <div class="language-switch">
        <select id="language" onchange="changeLanguage()">
            <option value="en-US">English</option>
            <option value="zh-CN">简体中文</option>
            <option value="ar-SA">العربية</option>
            <option value="bg-BG">Български</option>
            <option value="ca-ES">Català</option>
            <option value="cs-CZ">Čeština</option>
            <option value="da-DK">Dansk</option>
            <option value="de-DE">Deutsch</option>
            <option value="el-GR">Ελληνικά</option>
            <option value="es-ES">Español</option>
            <option value="fa-IR">فارسی</option>
            <option value="fi-FI">Suomi</option>
            <option value="fil-PH">Filipino</option>
            <option value="fr-FR">Français</option>
            <option value="he-IL">עברית</option>
            <option value="hi-IN">हिन्दी</option>
            <option value="hr-HR">Hrvatski</option>
            <option value="hu-HU">Magyar</option>
            <option value="id-ID">Bahasa Indonesia</option>
            <option value="it-IT">Italiano</option>
            <option value="ja-JP">日本語</option>
            <option value="ko-KR">한국어</option>
            <option value="ms-MY">Bahasa Melayu</option>
            <option value="nb-NO">Norsk</option>
            <option value="nl-NL">Nederlands</option>
            <option value="pl-PL">Polski</option>
            <option value="pt-PT">Português</option>
            <option value="ro-RO">Română</option>
            <option value="ru-RU">Русский</option>
            <option value="sk-SK">Slovenčina</option>
            <option value="sl-SI">Slovenščina</option>
            <option value="sr-RS">Српски</option>
            <option value="sv-SE">Svenska</option>
            <option value="th-TH">ไทย</option>
            <option value="tr-TR">Türkçe</option>
            <option value="uk-UA">Українська</option>
            <option value="vi-VN">Tiếng Việt</option>
            <option value="zh-TW">繁體中文</option>
        </select>
    </div>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('wifi')" data-lang="wifi_tab">Wi-Fi Config</div>
        <div class="tab" onclick="switchTab('advanced')" data-lang="advanced_tab">Advanced</div>
    </div>

    <div id="wifi-tab" class="tab-content active">
        <div id="saved_list_container" style="display: none;">
            <h3 data-lang="saved_wifi">Saved Wi-Fi</h3>
            <ul id="saved_list">
                <li><span>SSID</span></li>
            </ul>
        </div>
        
        <div>
            <h3 data-lang="new_wifi">New Wi-Fi</h3>
            <p class="error" style="color: red; text-align: center;" id="error"></p>
            <form action="/submit" method="post" onsubmit="submitForm(event)">
                <p>
                    <label for="ssid">SSID:</label>
                    <input type="text" id="ssid" name="ssid" required readonly>
                </p>
                <p>
                    <label for="username" data-lang="username">Username (Optional for Enterprise):</label>
                    <input type="text" id="username" name="username" placeholder="Required for Enterprise Network">
                </p>
                <p>
                    <label for="password" data-lang="password">Password:</label>
                    <input type="password" id="password" name="password">
                </p>
                <p style="text-align: center;">
                    <input type="submit" value="Connect" id="button" data-lang-value="connect">
                </p>
            </form>
            <p id="ap_list"></p>
        </div>
    </div>

    <div id="advanced-tab" class="tab-content">
        <form action="/advanced/submit" method="post" onsubmit="submitAdvancedForm(event)">
            <div>
                <h3 data-lang="advanced_tab">Advanced</h3>
                <p class="error" style="color: red; text-align: center;" id="advanced_error"></p>
                
                <p>
                    <label for="ota_url" data-lang="ota_url">Custom OTA URL:</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="text" id="ota_url" name="ota_url" style="flex: 1;">
                        <button type="button" onclick="clearOtaUrl()" style="padding: 5px 10px; border: 1px solid #ccc; border-radius: 3px; background-color: #f0f0f0; cursor: pointer;">❌</button>
                    </div>
                </p>

                <p style="display: flex; align-items: center; gap: 10px;">
                    <label for="max_tx_power" data-lang="max_tx_power" style="white-space: nowrap;">Wi-Fi Max TX Power:</label>
                    <select id="max_tx_power" name="max_tx_power">
                        <option value="8">2 dBm</option>
                        <option value="20">5 dBm</option>
                        <option value="28">7 dBm</option>
                        <option value="34">8 dBm</option>
                        <option value="44">11 dBm</option>
                        <option value="52">13 dBm</option>
                        <option value="56">14 dBm</option>
                        <option value="60">15 dBm</option>
                        <option value="66">16 dBm</option>
                        <option value="72">18 dBm</option>
                        <option value="80">20 dBm</option>
                    </select>
                </p>

                <p style="display: flex; align-items: center; gap: 10px;">
                    <label for="remember_bssid" style="margin: 0;">
                        <span data-lang="remember_bssid">Remember BSSID when connecting to Wi-Fi</span>
                    </label>
                    <input type="checkbox" id="remember_bssid" name="remember_bssid">
                </p>

                <p style="display: flex; align-items: center; gap: 10px;">
                    <label for="sleep_mode" style="margin: 0;">
                        <span data-lang="sleep_mode">Enable Sleep Mode</span>
                    </label>
                    <input type="checkbox" id="sleep_mode" name="sleep_mode">
                </p>

                <p style="text-align: center;">
                    <input type="submit" value="Save" id="advanced_button" data-lang-value="save">
                </p>
            </div>
        </form>
    </div>

    <script type="text/javascript">
        // ========== Global Variables ==========
        const button = document.getElementById('button');
        const error = document.getElementById('error');
        const ssid = document.getElementById('ssid');
        const username = document.getElementById('username');
        let support5G = false; 

        // ========== Translation Data ==========
        // (Assuming existing translation object structure, adding username key for brevity)
        const translations = {
            'zh-CN': {
                title: '网络配置',
                saved_wifi: '已保存的 Wi-Fi',
                new_wifi: '新的 Wi-Fi',
                username: '用户名 (企业网必填):',
                password: '密码:',
                connect: '连接',
                connecting: '正在连接...',
                select_wifi: '从下面列表选择 2.4G Wi-Fi:',
                select_wifi_5g: '从下面列表选择 Wi-Fi:',
                scanning: '扫描中...',
                wifi_tab: 'Wi-Fi 配置',
                advanced_tab: '高级选项',
                ota_url: '自定义 OTA 地址:',
                max_tx_power: 'Wi-Fi 最大发射功率:',
                remember_bssid: '连接 Wi-Fi 时记住 BSSID',
                sleep_mode: '启用睡眠模式',
                save: '保存'
            },
            'en-US': {
                title: 'Network Configuration',
                saved_wifi: 'Saved Wi-Fi',
                new_wifi: 'New Wi-Fi',
                username: 'Username (Optional for Enterprise):',
                password: 'Password:',
                connect: 'Connect',
                connecting: 'Connecting...',
                select_wifi: 'Select a 2.4G Wi-Fi from the list below:',
                select_wifi_5g: 'Select a Wi-Fi from the list below:',
                scanning: 'Scanning...',
                wifi_tab: 'Wi-Fi Config',
                advanced_tab: 'Advanced',
                ota_url: 'Custom OTA URL:',
                max_tx_power: 'Wi-Fi Max TX Power:',
                remember_bssid: 'Remember BSSID when connecting to Wi-Fi',
                sleep_mode: 'Enable Sleep Mode',
                save: 'Save'
            }
            // ... (other languages can be filled similarly)
        };
        
        // Basic fallback for other languages to use English keys if not defined
        const defaultLang = 'en-US';

        // ========== Language Mapping ==========
        // (Keep existing languageMap)
        const languageMap = {
            'zh': 'zh-CN', 'zh-CN': 'zh-CN', 'zh-TW': 'zh-TW', 'zh-HK': 'zh-TW',
            'en': 'en-US', 'en-US': 'en-US'
            // ... others
        };

        function getSupportedLanguage(lang) {
            // ... (Keep existing implementation)
            const mainLang = lang.split('-')[0];
            if (languageMap[lang]) return languageMap[lang];
            if (languageMap[mainLang]) return languageMap[mainLang];
            return 'en-US';
        }

        function changeLanguage() {
            const lang = document.getElementById('language').value;
            const t = translations[lang] || translations['en-US'];
            
            document.title = t.title;
            
            document.querySelectorAll('[data-lang]').forEach(element => {
                const key = element.getAttribute('data-lang');
                if (t[key]) element.textContent = t[key];
            });
            
            document.querySelectorAll('[data-lang-value]').forEach(element => {
                const key = element.getAttribute('data-lang-value');
                if (t[key]) element.value = t[key];
            });
            
            const apList = document.getElementById('ap_list');
            if (apList.firstChild) {
                const selectText = support5G ? t.select_wifi_5g : t.select_wifi;
                apList.firstChild.textContent = selectText;
            }
            
            localStorage.setItem('preferred_language', lang);
        }

        // ========== Wi-Fi List Management ==========
        // ... (Keep renderSavedList, deleteItem, setDefaultItem, loadSavedList)
        function renderSavedList(data) {
             const savedListContainer = document.getElementById('saved_list_container');
            const savedList = document.getElementById('saved_list');
            savedList.innerHTML = '';
            
            data.forEach((ssid, index) => {
                const li = document.createElement('li');
                let html = `<span>${ssid}</span>`;
                if (index > 0) {
                    html += ` <span><button type="button" onclick="setDefaultItem(this, ${index})">⬆️</button> <button type="button" onclick="deleteItem(this, ${index})">❌</button></span>`;
                } else {
                    html += ` <span><button type="button" onclick="deleteItem(this, ${index})">❌</button></span>`;
                }
                li.innerHTML = html;
                savedList.appendChild(li);
            });
            savedListContainer.style.display = data.length > 0 ? 'block' : 'none';
        }

        function deleteItem(item, index) {
            item.disabled = true;
            fetch('/saved/delete?index=' + index).then(() => loadSavedList());
        }

        function setDefaultItem(item, index) {
            item.disabled = true;
            fetch('/saved/set_default?index=' + index).then(() => loadSavedList());
        }

        function loadSavedList() {
            fetch('/saved/list').then(r => r.json()).then(data => renderSavedList(data));
        }

        function loadAPList() {
            if (button.disabled) return;
            const lang = document.getElementById('language').value;
            const t = translations[lang] || translations['en-US'];
            const apList = document.getElementById('ap_list');
            
            if (!apList.querySelector('a')) {
                apList.innerHTML = '<p class="scanning">' + t.scanning + '</p>';
            }

            fetch('/scan')
                .then(response => response.json())
                .then(data => {
                    support5G = data.support_5g;
                    const selectText = support5G ? t.select_wifi_5g : t.select_wifi;
                    apList.innerHTML = '<p>' + selectText + '</p>';
                    
                    data.aps.forEach(ap => {
                        const link = document.createElement('a');
                        link.href = '#';
                        let securityIcon = ' 🔒';
                        if (ap.authmode === 0) securityIcon = ' 🌐'; // Open
                        else if (ap.authmode === 5) securityIcon = ' 🏢'; // Enterprise

                        link.textContent = ap.ssid + ' (' + ap.rssi + ' dBm)' + securityIcon;
                        
                        link.addEventListener('click', () => {
                            ssid.value = ap.ssid;
                            // Auto focus username if it's enterprise
                            if (ap.authmode === 5) {
                                username.focus();
                                username.style.borderColor = "#007bff";
                            } else {
                                username.style.borderColor = "#ccc";
                            }
                        });
                        
                        apList.appendChild(link);
                    });
                    setTimeout(loadAPList, 5000);
                })
                .catch(error => {
                    console.error('Error:', error);
                    setTimeout(loadAPList, 5000);
                });
        }

        // ========== Form Submission ==========
        async function submitForm(event) {
            event.preventDefault();
            button.disabled = true;
            error.textContent = '';
            document.getElementById('loadingOverlay').classList.add('show');

            const payload = {
                ssid: ssid.value,
                password: document.getElementById('password').value,
                username: username.value // Added username to payload
            };

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (!data.success) throw new Error(data.error || 'Connection failed');
                window.location.href = '/done.html';
            } catch (err) {
                document.getElementById('loadingOverlay').classList.remove('show');
                error.textContent = err.message;
                button.disabled = false;
            }
        }

        // ... (Keep submitAdvancedForm, switchTab, showToast, loadAdvancedConfig, clearOtaUrl)
        async function submitAdvancedForm(event) {
            event.preventDefault();
            const btn = document.getElementById('advanced_button');
            const err = document.getElementById('advanced_error');
            btn.disabled = true;
            err.textContent = '';
            const config = {
                ota_url: document.getElementById('ota_url').value,
                max_tx_power: parseInt(document.getElementById('max_tx_power').value),
                remember_bssid: document.getElementById('remember_bssid').checked,
                sleep_mode: document.getElementById('sleep_mode').checked
            };
            try {
                const res = await fetch('/advanced/submit', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(config) });
                const data = await res.json();
                if(!data.success) throw new Error(data.error);
                showToast('Configuration saved');
            } catch(e) { err.textContent = e.message; }
            btn.disabled = false;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');
            document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function loadAdvancedConfig() {
            try {
                const r = await fetch('/advanced/config');
                const d = await r.json();
                if(d.ota_url) document.getElementById('ota_url').value = d.ota_url;
                if(d.max_tx_power) document.getElementById('max_tx_power').value = d.max_tx_power;
                if(d.remember_bssid !== undefined) document.getElementById('remember_bssid').checked = d.remember_bssid;
                if(d.sleep_mode !== undefined) document.getElementById('sleep_mode').checked = d.sleep_mode;
            } catch(e) {}
        }

        function clearOtaUrl() { document.getElementById('ota_url').value = ''; }

        // ========== Initialization ==========
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const savedLang = urlParams.get('lang') || localStorage.getItem('preferred_language') || getSupportedLanguage(navigator.language);
            document.getElementById('language').value = savedLang;
            changeLanguage();
            loadSavedList();
            loadAPList();
            loadAdvancedConfig();
        });

        window.addEventListener('pageshow', (e) => { if(e.persisted) loadSavedList(); });
        ssid.addEventListener('touchstart', () => { ssid.removeAttribute('readonly'); ssid.focus(); }, {once: true});
    </script>
</body>
</html>
